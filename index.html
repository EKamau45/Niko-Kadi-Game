<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Ace</title>
</head>
<body>
  <header>
    <div class="Intro">
      <div>
        <button>logo</button>
      </div>
      <div>
        <h1>Tucheze kadi (Ace, Poker)</h1>
      </div>
      <div>
        <button>Account</button>
      </div>
    </div>
  </header>
  <main>
    <div class="container">
      <div class="Play">
        <!-- OPPONENTS SECTION -->
        <div class="opponents">
          <div class="OpAccount">
            <div class="Details">
              <button id="Op-btn">&</button>
              <span>Player 2 </span>
            </div>
            <div class="Score">
              <span>Score: 0</span>
            </div>
          </div>
          <div class="opponent-cards">
            <!-- Opponent cards will display here -->
          </div>
        </div>

        <!-- PLAYFIELD SECTION -->
        <div class="playfield">
          <div class="playfield-header">
            <span>Playfield</span>
          </div>
          <div class="playfield-cards">
            <!-- Cards played on the field -->
          </div>
        </div>

        <!-- MIDDLE SECTION: Deck -->
        <div class="middle-section">
          <div class="cards">
            <div class="cards-header">
              <span>Deck</span>
            </div>
            <div class="cards-deck">
              <!-- Drawing deck cards -->
            </div>
          </div>
        </div>

        <!-- MY CARDS SECTION -->
        <div class="my-cards">
          <div class="MyAccount">
            <div class="Details">
              <button id="Op-btn">&</button>
              <span>Edwin45 </span>
            </div>
            <div class="Score">
              <span>Score: 0</span>
            </div>
          </div>
          <div class="my-cards-hand">
            <!-- Player's hand cards display here -->
          </div>
        </div>
      </div>
    </div>

  </main>
  <footer>

  </footer>
  <script src="script.js"></script>
</body>
</html>
